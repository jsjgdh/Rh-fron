[package]
name = "rhexiom-frontend"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
dioxus-logger = "0.7.4"
lazy_static = "1.5.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3.95", features = ["Window", "Location", "Storage"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
